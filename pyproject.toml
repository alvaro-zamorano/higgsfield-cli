[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "higgsfield-cli"
version = "0.1.0"
description = "CLI `hf` for the Higgsfield API: images, video and workflows with validation, downloads, history and Cloudinary."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "higgsfield-client==0.2.0",
    "python-dotenv>=1.0",
    "jsonschema>=4.18",
    "httpx>=0.21,<0.29",
]

[project.optional-dependencies]
cloudinary = ["cloudinary>=1.40"]
mcp = ["mcp>=1.26,<2; python_version>='3.10'", "Pillow>=10"]
dev = ["pytest>=8"]

[project.scripts]
hf = "hfcli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hfcli = ["catalog.json", "prompt_guides/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
